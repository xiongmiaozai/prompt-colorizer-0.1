  # ============================================================
  # 时间戳
  dsl-timestamp:
    color: "cyan"
    fontWeight: "500"
    fontFamily: "monospace"

  # 版本号
  dsl-version-number:
    color: "purple"
    fontWeight: "600"
    fontFamily: "monospace"

  # URL 链接
  dsl-url-link:
    color: "info"
    textDecoration: "underline"

  # 文件路径
  dsl-file-path:
    color: "slate"
    fontFamily: "monospace"
    background: "slate.soft"
    borderRadius: "3px"
    padding: "0 2px"

  # 命令行指令
  dsl-cli-command:
    color: "emerald"
    fontWeight: "600"
    fontFamily: "monospace"
    background: "emerald.soft"
    borderRadius: "4px"
    padding: "0 4px"
    boxShadow: "0 1px 4px emerald.soft"

  # 键盘快捷键
  dsl-kbd-tag:
    color: "slate"
    fontWeight: "600"
    fontFamily: "monospace"
    background: "slate.soft"
    borderRadius: "4px"
    padding: "1px 6px"
    border: "1px solid slate.border"
    boxShadow: "0 2px 4px slate.soft"

  # HTML 标签
  dsl-html-tag:
    color: "purple"
    fontWeight: "500"
    fontFamily: "monospace"

  # 键值分隔符
  dsl-key-value:
