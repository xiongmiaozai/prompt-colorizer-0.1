# 动态颜色配置 — 颜色完全由 YAML 驱动，支持无限扩展
# 工作原理：colors 区定义令牌 → 插件生成 CSS 变量 → styleRules 区引用令牌名
#
# 修改颜色步骤：
# 1. 在 colors 区找到对应令牌
# 2. 修改 light/dark 值
# 3. 保存后插件自动重新加载（或重启 Obsidian）
#
# 新增颜色步骤：
# 1. 在 colors 区添加新令牌（如 mycolor: { light: "#ff0000", dark: "#ff5555" }）
# 2. 在 styleRules 中用令牌名引用（如 color: "mycolor"）
# 3. 支持 .soft 和 .border 修饰（如 background: "mycolor.soft"）

# ============================================================
# 颜色定义区 — 定义所有可用的颜色令牌
# 每个令牌自动生成 3 个 CSS 变量：
#   --dsl-{name}        → 主色
#   --dsl-{name}-soft   → 半透明背景（自动计算 6% 透明度）
#   --dsl-{name}-border → 边框色（自动计算 15% 透明度）
# ============================================================
colors:
  # ---- 基础 10 令牌 ----
  danger:
    light: "#ef4444"
    dark: "#f87171"
    name: { zh: "红色（排除/禁止）", en: "Red (Exclude)" }
    desc: { zh: "排除规则、SD 负面提示词头", en: "Exclusion rules, SD negative" }
  success:
    light: "#10b981"
    dark: "#34d399"
    name: { zh: "绿色（成功/台词）", en: "Green (Success)" }
    desc: { zh: "台词内容、质量标签", en: "Dialogue, quality tags" }
  warning:
    light: "#d97706"
    dark: "#f59e0b"
    name: { zh: "黄色（警告/参数）", en: "Yellow (Warning)" }
    desc: { zh: "技术参数、变量、权重标记", en: "Tech params, variables, weights" }
  info:
    light: "#3b82f6"
    dark: "#60a5fa"
    name: { zh: "蓝色（信息/标签）", en: "Blue (Info)" }
    desc: { zh: "字段标签、括号强调", en: "Field labels, bracket emphasis" }
  purple:
    light: "#8b5cf6"
    dark: "#a78bfa"
    name: { zh: "紫色（区段/指令）", en: "Purple (Section)" }
    desc: { zh: "区段标记、角色标签、指令标记", en: "Section markers, role tags" }
  cyan:
    light: "#0891b2"
    dark: "#22d3ee"
    name: { zh: "青色（分镜/运镜）", en: "Cyan (Shot)" }
    desc: { zh: "分镜标题、镜头运动术语", en: "Shot headers, camera moves" }
  pink:
    light: "#db2777"
    dark: "#f472b6"
    name: { zh: "粉色（音频）", en: "Pink (Audio)" }
    desc: { zh: "音频引用、音色标签", en: "Audio references, tone tags" }
  amber:
    light: "#b45309"
    dark: "#d97706"
    name: { zh: "棕色（资源引用）", en: "Amber (Asset)" }
    desc: { zh: "资源引用、Lora 模型引用", en: "Asset refs, Lora models" }
  orange:
    light: "#ea580c"
    dark: "#fb923c"
    name: { zh: "橙色（光效）", en: "Orange (Light)" }
    desc: { zh: "光效术语", en: "Light effect terms" }
  paren:
    light: "#94a3b8"
    dark: "#94a3b8"
    name: { zh: "灰色（括号注释）", en: "Gray (Parenthetical)" }
    desc: { zh: "括号注释、弱化标记", en: "Parenthetical notes, weak markers" }

  # ---- 扩展令牌 ----
  indigo:
    light: "#6366f1"
    dark: "#818cf8"
    name: { zh: "靛蓝（Chat Token）", en: "Indigo (Chat Token)" }
    desc: { zh: "Chat Template Token", en: "Chat tokens, special markers" }
  emerald:
    light: "#059669"
    dark: "#10b981"
    name: { zh: "翠绿（Mermaid/命令）", en: "Emerald (Mermaid)" }
    desc: { zh: "Mermaid 图表、命令行指令", en: "Mermaid diagrams, CLI commands" }
  slate:
    light: "#64748b"
    dark: "#94a3b8"
    name: { zh: "石板灰（引用/注释）", en: "Slate (Quote)" }
    desc: { zh: "嵌套引用、Frontmatter", en: "Nested quotes, frontmatter" }
  darkslate:
    light: "#1e293b"
    dark: "#e2e8f0"
    name: { zh: "深石板（标题）", en: "Dark Slate (Heading)" }
    desc: { zh: "Markdown 标题", en: "Markdown headings" }
  yellow:
    light: "#facc15"
    dark: "#fde047"
    name: { zh: "黄色（高亮）", en: "Yellow (Highlight)" }
    desc: { zh: "高亮标记", en: "Highlight markers" }

  music:
    light: "#c026d3"
    dark: "#e879f9"
    name: { zh: "品红（音乐生成）", en: "Music (Magenta)" }
    desc: { zh: "Suno 歌词段落、音乐元标签", en: "Suno lyrics, music meta tags" }

# ============================================================
# 样式规则区 — 每条规则引用颜色令牌名
# 引用格式：
#   "danger"         → var(--dsl-danger)
#   "danger.soft"    → var(--dsl-danger-soft)（半透明背景）
#   "danger.border"  → var(--dsl-danger-border)（边框色）
#   "1px solid danger.border" → 1px solid var(--dsl-danger-border)
# ============================================================
styleRules:
  # ============================================================
  # 一、基础结构
  # ============================================================
  dsl-block-wrapper:
    color: "purple"
    fontWeight: "bold"
    fontSize: "1.05em"
    letterSpacing: "0.08em"
    backgroundImage: "linear-gradient(135deg, purple.soft, indigo.soft)"
    border: "1px solid purple.border"
    borderRadius: "8px"
    padding: "1px 12px"
    # 悬停色相偏移：hover 时整块旋转 30° 色相（项 9）
    hover:
      filter: "hue-rotate(30deg) saturate(1.15)"


  dsl-shot-header:
    fontWeight: "bold"
    # 彩虹流动：多色渐变文字 + 背景滚动动画（pc-rainbow-flow keyframes 由引擎按需注入）
    backgroundImage: "linear-gradient(90deg, cyan, info, purple, pink, cyan)"
    backgroundSize: "200% 100%"
    backgroundClip: "text"
    animation: "pc-rainbow-flow 6s linear infinite"
    textShadow: "cyan.glow"

  dsl-asset:
    color: "amber"
    fontWeight: "600"
    before:
      content: '"▸ "'
      color: "amber"
      fontSize: "0.85em"
    after:
      content: "attr(data-ref)"
      color: "amber"
      fontSize: "0.65em"
      fontWeight: "600"
      verticalAlign: "super"
      marginLeft: "1px"
      opacity: "0.8"

  dsl-asset-bracket:
    color: "amber"
    fontWeight: "500"

  dsl-param-key:
    color: "info"
    fontWeight: "600"
    borderBottom: "2px solid info.border"

  dsl-dialogue:
    color: "success"
    fontStyle: "italic"
    background: "success.soft"
    borderRadius: "4px"
    padding: "0 2px"
    hover:
      background: "success.border"

  # 中文引号「」『』弱化（v2.4.1 新增，突出引号内台词）
  dsl-dialogue-quote:
    color: "paren"
    opacity: "0.60"

  dsl-constraint:
    color: "danger"
    fontWeight: "600"
    textDecoration: "line-through"
    background: "danger.soft"
    borderRadius: "4px"
    padding: "0 2px"

  dsl-tech-param:
    color: "warning"
    fontWeight: "600"
    borderBottom: "2px solid warning.border"

  dsl-parenthetical:
    color: "paren"
    fontStyle: "italic"
    opacity: "0.70"

  dsl-variable:
    color: "warning"
    fontWeight: "600"
    fontFamily: "monospace"
    textDecoration: "underline wavy warning"

  dsl-role-tag:
    color: "purple"
    fontWeight: "bold"
    fontFamily: "monospace"
    fontSize: "0.92em"
    opacity: "0.85"
    letterSpacing: "0.05em"

  dsl-instruction:
    color: "var(--text-on-accent, #ffffff)"
    background: "purple"
    fontWeight: "bold"
    fontFamily: "monospace"
    borderRadius: "4px"
    padding: "0 3px"


  # ============================================================
  # 二、SD/ComfyUI 扩展
  # ============================================================
  dsl-emphasis-weight:
    color: "warning"
    fontWeight: "600"
    fontFamily: "monospace"
    background: "warning.soft"
    borderRadius: "4px"
    padding: "0 2px"
    hover:
      background: "warning.border"

  dsl-lora-ref:
    color: "amber"
    fontWeight: "bold"
    background: "amber.soft"
    borderRadius: "4px"
    padding: "0 2px"
    hover:
      background: "amber.border"

  dsl-bracket-strong:
    color: "info"
    fontWeight: "bold"

  dsl-bracket-weak:
    textStroke: "1px paren"
    textFillColor: "transparent"
    opacity: "0.75"

  dsl-quality-tag:
    color: "success"
    fontWeight: "600"
    backgroundImage: "linear-gradient(to top, success.soft 45%, transparent 45%)"

  dsl-sd-negative-header:
    color: "danger"
    fontWeight: "bold"
    textShadow: "danger.glow"
    backgroundImage: "linear-gradient(to right, danger.soft, transparent)"
    borderLeft: "3px solid danger"
    paddingLeft: "12px"
    borderRadius: "0 4px 4px 0"

  # SD 参数标记：--ar 16:9 --v 6
  dsl-sd-parameter:
    color: "purple"
    fontWeight: "600"
    fontFamily: "monospace"
    background: "purple.soft"
    borderRadius: "3px"
    padding: "0 3px"

  # 音频相关
  dsl-audio-ref:
    color: "pink"
    fontWeight: "600"

  dsl-audio-tone:
    color: "pink"
    fontWeight: "500"
    fontStyle: "italic"

  dsl-audio-sfx:
    color: "pink"
    fontWeight: "600"

  # ============================================================
  # 三、AI 工具结构化语法（2025-2026 趋势，紫蓝科技系）
  # ============================================================
  # ANTML 命名空间标签（最高优先级强调）
  dsl-antml-tag:
    color: "purple"
    fontWeight: "bold"
    background: "purple.soft"
    borderRadius: "4px"
    padding: "0 2px"


  dsl-function-results:
    color: "purple"
    fontWeight: "600"
    background: "purple.soft"
    borderRadius: "4px"

  dsl-xml-block:
    color: "purple"
    fontWeight: "600"

  dsl-chat-token:
    color: "indigo"
    fontWeight: "bold"

  dsl-llama-token:
    color: "indigo"
    fontWeight: "bold"

  dsl-gemma-token:
    color: "info"
    fontWeight: "bold"

  dsl-llama-sys:
    color: "purple"
    fontWeight: "bold"

  dsl-workflow-sep:
    color: "paren"
    fontWeight: "600"
    fontStyle: "italic"

  dsl-json-schema-key:
    color: "warning"
    fontWeight: "600"

  dsl-jinja-control:
    color: "purple"
    fontWeight: "600"
    background: "purple.soft"
    borderRadius: "4px"
    padding: "0 2px"

  dsl-workflow-node:
    color: "cyan"
    fontWeight: "600"

  # ============================================================
  # 四、Markdown 扩展语法
  # ============================================================
  dsl-md-mermaid:
    color: "emerald"
    fontWeight: "bold"
    background: "emerald.soft"
    borderRadius: "4px"

  dsl-md-nested-quote:
    color: "slate"
    fontStyle: "italic"

  dsl-md-anchor-link:
    color: "info"
    fontWeight: "500"
    textDecoration: "underline dotted"

  dsl-md-callout-meta:
    color: "warning"
    fontWeight: "bold"
    background: "warning.soft"
    borderRadius: "4px"
    padding: "0 4px"

  dsl-md-admonition:
    color: "warning"
    fontWeight: "bold"
    background: "warning.soft"
    borderRadius: "4px"

  # ============================================================
  # 四-B、基础 Markdown 语法
  # ============================================================
  # Frontmatter 分隔符
  dsl-md-frontmatter:
    color: "slate"
    fontWeight: "bold"
    opacity: "0.60"

  # 标题标记
  dsl-md-heading:
    color: "darkslate"
    fontWeight: "bold"


  # 粗体
  dsl-md-bold:
    fontWeight: "bold"

  # 斜体
  dsl-md-italic:
    fontStyle: "italic"

  # 删除线
  dsl-md-strikethrough:
    color: "paren"
    textDecoration: "line-through"

  # 代码块围栏
  dsl-md-code-fence:
    color: "slate"
    fontWeight: "600"
    fontFamily: "monospace"
    background: "slate.soft"
    borderRadius: "4px"

  # 行内代码
  dsl-md-inline-code:
    color: "pink"
    fontFamily: "monospace"
    background: "pink.soft"
    borderRadius: "3px"
    padding: "0 3px"

  # 链接
  dsl-md-link:
    color: "info"
    textDecoration: "underline"

  # 图片
  dsl-md-image:
    color: "cyan"
    fontWeight: "500"

  # Wiki 链接
  dsl-md-wiki-link:
    color: "info"
    fontWeight: "500"

  # 标签 #tag
  dsl-md-tag:
    color: "purple"
    fontWeight: "500"

  # 任务列表标记
  dsl-md-task:
    color: "emerald"
    fontWeight: "bold"

  # 脚注引用
  dsl-md-footnote:
    color: "indigo"
    fontWeight: "500"
    fontSize: "0.85em"
    verticalAlign: "super"

  # 脚注定义
  dsl-md-footnote-def:
    color: "indigo"
    fontWeight: "600"

  # 数学公式块
  dsl-md-math:
    color: "purple"
    fontWeight: "bold"

  # 行内数学公式
  dsl-md-math-inline:
    color: "purple"

  # 引用块
  dsl-md-blockquote:
    color: "slate"
    fontStyle: "italic"
    borderLeft: "3px solid slate.border"
    paddingLeft: "12px"

  # Callout 块
  dsl-md-callout:
    color: "warning"
    fontWeight: "bold"
    backgroundImage: "linear-gradient(135deg, warning.soft, amber.soft)"
    borderRadius: "4px"
    padding: "0 4px"


  # 水平分割线
  dsl-md-hr:
    color: "paren"
    opacity: "0.50"

  # 表格分隔行
  dsl-md-table-sep:
    color: "paren"
    fontFamily: "monospace"

  # 表格行
  dsl-md-table-row:
    color: "slate"
    fontFamily: "monospace"

  # 列表项
  dsl-md-list-item:
