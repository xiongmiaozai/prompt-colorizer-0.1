    fontWeight: "600"

  # 定义列表
  dsl-md-definition:
    color: "cyan"
    fontWeight: "500"

  # 块引用 ID
  dsl-md-block-id:
    color: "paren"
    fontFamily: "monospace"
    fontSize: "0.85em"

  # Obsidian 注释
  dsl-md-comment:
    color: "paren"
    fontStyle: "italic"
    opacity: "0.50"
    fontSize: "0.92em"
    backgroundImage: "repeating-linear-gradient(45deg, paren.soft 0 2px, transparent 2px 6px)"

  # Emoji 短码
  dsl-md-emoji:
    color: "emerald"

  # 高亮标记
  dsl-md-highlight:
    background: "yellow.soft"
    borderRadius: "3px"
    padding: "0 2px"

  # YAML/JSON 键值
  dsl-md-yaml-key:
    color: "warning"
    fontWeight: "600"

  # ============================================================
  # 五、操作档案扩展标记
  # ============================================================
  dsl-email:
    color: "info"
    fontWeight: "500"

  dsl-ip-address:
